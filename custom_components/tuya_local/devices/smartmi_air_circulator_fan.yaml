# Smartmi Air Circulator Fan
# Category: fs
# Product ID (PID): ld6lwruyddlfx7a2
# Tested with Tuya Local
#
# Protocol: this device needs protocol 3.2. On 3.3 a plain status query
# returns "json obj data unvalid" (Err 900), so entities stay unknown
# until each setting next changes.
#
# DP 107 is the fan speed 1-100. DP 3 (level 1-4) sets it to 1/37/77/100.
# DP 110/111: left/right ends of the horizontal sweep, absolute head
# position, 0 = far left, 60 = centre, 120 = far right.
# DP 112/113: bottom/top ends of the vertical sweep, 0 = level.
# Equal values park the head. DP 7 and DP 110/111: last write wins.
# DP 101/102 centre the head; the device resets them itself and turns that
# axis' oscillation off.
# DP 115 (temperature) is reported only while the app's test switch is on.

name: Circulating fan
products:
  - id: ld6lwruyddlfx7a2
    manufacturer: Smartmi
    model: ZLBPKQXHS02ZM
entities:
  # -------------------------------------------------------
  # Fan
  # -------------------------------------------------------
  - entity: fan
    translation_key: fan_with_presets
    dps:
      - id: 1
        name: switch
        type: boolean

      - id: 2
        name: preset_mode
        type: string
        mapping:
          - dps_val: normal
            value: normal
          - dps_val: nature
            value: nature
          - dps_val: temp
            value: auto

      - id: 5
        name: oscillate
        type: boolean

      - id: 107
        name: speed
        type: integer
        optional: true
        range:
          min: 1
          max: 100

  - entity: select
    name: Speed level
    dps:
      - id: 3
        name: option
        type: integer
        optional: true
        mapping:
          - dps_val: 1
            value: "1"
          - dps_val: 2
            value: "2"
          - dps_val: 3
            value: "3"
          - dps_val: 4
            value: "4"

  # -------------------------------------------------------
  # Timer
  # -------------------------------------------------------
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 22
        name: option
        type: string
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: 1h
          - dps_val: "2h"
            value: 2h
          - dps_val: "3h"
            value: 3h
          - dps_val: "4h"
            value: 4h
          - dps_val: "5h"
            value: 5h
          - dps_val: "6h"
            value: 6h
          - dps_val: "7h"
            value: 7h
          - dps_val: "8h"
            value: 8h

  # -------------------------------------------------------
  # Oscillation
  # -------------------------------------------------------
  - entity: switch
    name: Vertical oscillation
    dps:
      - id: 4
        name: switch
        type: boolean

  - entity: switch
    name: Horizontal oscillation
    dps:
      - id: 5
        name: switch
        type: boolean

  # -------------------------------------------------------
  # Angle
  # -------------------------------------------------------
  - entity: select
    name: Vertical angle
    dps:
      - id: 6
        name: option
        type: string
        mapping:
          - dps_val: "30"
            value: 30°
          - dps_val: "60"
            value: 60°
          - dps_val: "90"
            value: 90°

  - entity: select
    name: Horizontal angle
    dps:
      - id: 7
        name: option
        type: string
        mapping:
          - dps_val: "30"
            value: 30°
          - dps_val: "60"
            value: 60°
          - dps_val: "90"
            value: 90°
          - dps_val: "120"
            value: 120°

  # -------------------------------------------------------
  # Sweep end positions
  # -------------------------------------------------------
  - entity: number
    name: Horizontal sweep left
    dps:
      - id: 110
        name: value
        type: integer
        optional: true
        unit: "°"
        range:
          min: 0
          max: 120

  - entity: number
    name: Horizontal sweep right
    dps:
      - id: 111
        name: value
        type: integer
        optional: true
        unit: "°"
        range:
          min: 0
          max: 120

  - entity: number
    name: Vertical sweep bottom
    dps:
      - id: 112
        name: value
        type: integer
        optional: true
        unit: "°"
        range:
          min: 0
          max: 100

  - entity: number
    name: Vertical sweep top
    dps:
      - id: 113
        name: value
        type: integer
        optional: true
        unit: "°"
        range:
          min: 0
          max: 100

  - entity: button
    name: Center horizontal
    dps:
      - id: 101
        name: button
        type: boolean
        optional: true

  - entity: button
    name: Center vertical
    dps:
      - id: 102
        name: button
        type: boolean
        optional: true

  # -------------------------------------------------------
  # Sensors
  # -------------------------------------------------------
  - entity: sensor
    class: temperature
    dps:
      - id: 115
        name: sensor
        type: integer
        optional: true
        unit: C
        class: measurement
        mapping:
          - scale: 10

  # -------------------------------------------------------
  # Misc
  # -------------------------------------------------------
  - entity: switch
    translation_key: sound
    category: config
    dps:
      - id: 13
        name: switch
        type: boolean

  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 14
        name: lock
        type: boolean

  - entity: light
    translation_key: indicator
    category: config
    dps:
      - id: 15
        name: switch
        type: boolean
